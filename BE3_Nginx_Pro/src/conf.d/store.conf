server {
    listen 8081;
    listen 8444 ssl http2;

    server_name store-api.local localhost;

    # Local self-signed certificate generated by scripts/generate_cert.sh.
    ssl_certificate /home/user01/Desktop/BE/BE3_Nginx_Pro.ID_1269323-1/src/certs/store-api.local.crt;
    ssl_certificate_key /home/user01/Desktop/BE/BE3_Nginx_Pro.ID_1269323-1/src/certs/store-api.local.key;
    ssl_session_timeout 10m;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /home/user01/Desktop/BE/BE3_Nginx_Pro.ID_1269323-1/src/static;
    index index.html;

    location = /status {
        stub_status;
        access_log off;
        allow 127.0.0.1;
        allow ::1;
        deny all;
    }

    location = /api {
        return 308 /api/v1;
    }

    location ~ ^/api/(?!v1/|v2/)(.*)$ {
        return 308 /api/v1/$1;
    }

    location = /api/v1 {
        return 302 /swagger/index.html;
    }

    location = /api/v2 {
        return 302 /swagger/index.html;
    }

    location /api/v1/swagger/ {
        rewrite ^/api/v1/swagger/(.*)$ /swagger/$1 break;

        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache off;
    }

    location /api/v2/swagger/ {
        rewrite ^/api/v2/swagger/(.*)$ /swagger/$1 break;

        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache off;
    }

    location /swagger/ {
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache off;
    }

    location /api/v2/ {
        rewrite ^/api/v2/(.*)$ /api/v1/$1 break;

        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache off;
    }

    location /api/v1/ {
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache off;
    }

    location = /admin {
        return 301 /admin/;
    }

    location /admin/ {
        proxy_pass http://pgadmin_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_redirect / /admin/;
        proxy_cookie_path / /admin/;

        proxy_cache get_cache;
        proxy_cache_bypass $skip_proxy_cache;
        proxy_no_cache $skip_proxy_cache;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    location / {
        try_files $uri $uri/ /index.html;

        # Browser-side cache for static distribution files.
        expires 10m;
        add_header Cache-Control "public, max-age=600";
    }
}
