user user01;
worker_processes 1;

error_log logs/error.log info;
pid logs/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" "$upstream_addr"';

    access_log logs/access.log main;

    sendfile on;
    keepalive_timeout 65;

    # Cache all proxied GET/HEAD requests, except /api* paths.
    proxy_cache_path cache levels=1:2 keys_zone=get_cache:32m max_size=256m inactive=20m use_temp_path=off;

    map $request_method $api_upstream {
        default backend_main;
        GET backend_balanced;
        HEAD backend_balanced;
    }

    map $request_method $is_cacheable_method {
        default 0;
        GET 1;
        HEAD 1;
    }

    map $uri $is_api_request {
        default 0;
        ~^/api 1;
    }

    map "$is_cacheable_method$is_api_request" $skip_proxy_cache {
        default 1;
        "10" 0;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream backend_main {
        server 127.0.0.1:5000;
    }

    upstream backend_balanced {
        server 127.0.0.1:5000 weight=2 max_fails=2 fail_timeout=10s;
        server 127.0.0.1:5001 weight=1 max_fails=2 fail_timeout=10s;
        server 127.0.0.1:5002 weight=1 max_fails=2 fail_timeout=10s;
    }

    upstream pgadmin_upstream {
        server 127.0.0.1:5050;
    }

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml;

    include conf.d/*.conf;
}
