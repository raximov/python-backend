<!doctype html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <title>Product Updates — SSE</title>

  <style>
    body {
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    h1 {
      margin-bottom: 8px;
    }

    .panel {
      padding: 20px;
      background: white;
      border-radius: 10px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
    }

    .status {
      display: inline-block;
      margin-bottom: 16px;
      padding: 6px 12px;
      border-radius: 20px;
      background: #ddd;
    }

    button {
      margin-right: 8px;
      padding: 8px 14px;
      cursor: pointer;
    }

    pre {
      min-height: 240px;
      margin-top: 20px;
      padding: 16px;
      overflow: auto;
      color: #eaeaea;
      background: #1e1e1e;
      border-radius: 8px;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>
  <div class="panel">
    <h1>SSE product updates</h1>
    <p>
      Kelgan xabarlar sahifada va browser console'da ko‘rsatiladi.
    </p>

    <div id="status" class="status">Disconnected</div>

    <div>
      <button id="connectButton">Connect</button>
      <button id="disconnectButton">Disconnect</button>
      <button id="clearButton">Clear logs</button>
    </div>

    <pre id="logs"></pre>
  </div>

  <script>
    let eventSource = null;

    const statusElement = document.getElementById("status");
    const logsElement = document.getElementById("logs");

    function setStatus(text) {
      statusElement.textContent = text;
    }

    function writeLog(title, data = null) {
      const time = new Date().toLocaleTimeString();

      const message = data === null
        ? `[${time}] ${title}`
        : `[${time}] ${title}\n${JSON.stringify(data, null, 2)}`;

      logsElement.textContent += `${message}\n\n`;
      logsElement.scrollTop = logsElement.scrollHeight;

      console.log(title, data ?? "");
    }

    function connect() {
      if (eventSource) {
        writeLog("SSE allaqachon ulangan");
        return;
      }

      const url = `${location.origin}/sse/products`;

      setStatus("Connecting...");
      writeLog(`SSE ulanish boshlandi: ${url}`);

      eventSource = new EventSource(url);

      eventSource.onopen = () => {
        setStatus("Connected");
        writeLog("SSE connected");
      };

      eventSource.onmessage = (event) => {
        try {
          const payload = JSON.parse(event.data);

          writeLog("SSE message", payload);
        } catch (error) {
          writeLog("SSE raw message", event.data);
          console.error("JSON parse error:", error);
        }
      };

      eventSource.onerror = (error) => {
        console.error("SSE error:", error);

        if (
          eventSource &&
          eventSource.readyState === EventSource.CONNECTING
        ) {
          setStatus("Reconnecting...");
          writeLog("SSE connection lost, reconnecting");
          return;
        }

        setStatus("Disconnected");
        writeLog("SSE disconnected");
      };
    }

    function disconnect() {
      if (!eventSource) {
        writeLog("SSE ulanmagan");
        return;
      }

      eventSource.close();
      eventSource = null;

      setStatus("Disconnected");
      writeLog("SSE connection closed by client");
    }

    document
      .getElementById("connectButton")
      .addEventListener("click", connect);

    document
      .getElementById("disconnectButton")
      .addEventListener("click", disconnect);

    document
      .getElementById("clearButton")
      .addEventListener("click", () => {
        logsElement.textContent = "";
      });

    connect();
  </script>
</body>
</html>
