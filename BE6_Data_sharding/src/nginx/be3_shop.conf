# =========================
# CACHE
# =========================
proxy_cache_path /var/cache/nginx/be3
    levels=1:2
    keys_zone=be3_cache:10m
    max_size=100m
    inactive=60m
    use_temp_path=off;


# =========================
# GET LOAD BALANCING 2:1:1
# =========================
upstream api_read_pool {
    zone api_read_pool 64k;

    server 127.0.0.1:8000 weight=2;
    server 127.0.0.1:8001 weight=1;
    server 127.0.0.1:8002 weight=1;
}


# =========================
# WRITE REQUESTS -> MAIN
# =========================
upstream api_main {
    server 127.0.0.1:8000;
}


# GET/HEAD -> read pool
# POST/PUT/PATCH/DELETE -> main
map $request_method $api_backend {
    GET     api_read_pool;
    HEAD    api_read_pool;
    default api_main;
}


# =========================
# HTTP -> HTTPS
# =========================
server {
    listen 80;
    server_name shop.test;

    return 301 https://shop.test$request_uri;
}


# =========================
# HTTPS SERVER
# =========================
server {
    listen 443 ssl;
    server_name shop.test;

    ssl_certificate     /etc/nginx/ssl/shop.test.crt;
    ssl_certificate_key /etc/nginx/ssl/shop.test.key;

    ssl_protocols TLSv1.2 TLSv1.3;


    # =========================
    # GZIP
    # =========================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;

    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;


    # =========================
    # API
    # =========================

    location = /api {
        return 301 /api/;
    }

    location /api/ {
        rewrite ^/api/(.*)$ /api/v1/$1 break;

        proxy_pass http://$api_backend;

        # /api cache qilinmaydi
        proxy_cache off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header X-Upstream-Addr $upstream_addr always;
    }


    # =========================
    # SWAGGER
    # =========================

    location = /api/v1 {
        proxy_pass http://127.0.0.1:8000/swagger/index.html;

        proxy_cache be3_cache;
        proxy_cache_methods GET HEAD;
        proxy_cache_valid 200 10m;

        add_header X-Cache-Status $upstream_cache_status always;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }


    # =========================
    # OPENAPI
    # =========================

    location = /openapi.json {
        proxy_pass http://127.0.0.1:8000/openapi.json;

        proxy_cache be3_cache;
        proxy_cache_methods GET HEAD;
        proxy_cache_valid 200 10m;

        add_header X-Cache-Status $upstream_cache_status always;
    }


    # =========================
    # NGINX STATUS
    # =========================

    location = /status {
        stub_status;

        allow 127.0.0.1;
        allow ::1;
        deny all;
    }


    # =========================
    # PGADMIN
    # =========================

    location = /admin {
        return 301 /admin/;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:5050/;

        proxy_cache off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header X-Script-Name /admin;
        proxy_set_header X-Scheme $scheme;

        proxy_redirect off;
    }


    # =========================
    # STATIC
    # =========================

    location / {
        root /var/www/be3_shop;
        index index.html;

        try_files $uri $uri/ =404;

        expires 10m;
        add_header Cache-Control "public";
    }
}
