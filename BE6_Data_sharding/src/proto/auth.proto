syntax = "proto3";

package auth;

service AuthService {
  rpc Register(RegisterRequest) returns (TokenResponse);
  rpc Login(LoginRequest) returns (TokenResponse);
  rpc GoogleLogin(GoogleLoginRequest) returns (TokenResponse);
  rpc ValidateToken(ValidateTokenRequest) returns (ValidateTokenResponse);
  rpc ChangePassword(ChangePasswordRequest) returns (OperationResponse);
  rpc ResetPassword(ResetPasswordRequest) returns (OperationResponse);
}

message RegisterRequest {
  string email = 1;
  string first_name = 2;
  string last_name = 3;
  string phone_number = 4;
  string password = 5;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message GoogleLoginRequest {
  string email = 1;
  string first_name = 2;
  string last_name = 3;
  string google_sub = 4;
}

message ValidateTokenRequest {
  string token = 1;
}

message ValidateTokenResponse {
  bool valid = 1;
  string user_id = 2;
  string email = 3;
}

message ChangePasswordRequest {
  string email = 1;
  string current_password = 2;
  string new_password = 3;
}

message ResetPasswordRequest {
  string email = 1;
}

message TokenResponse {
  string access_token = 1;
  string token_type = 2;
}

message OperationResponse {
  bool success = 1;
  string message = 2;
}
