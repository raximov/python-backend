<!doctype html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <title>Product Updates — WebSocket</title>

  <style>
    body {
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    h1 {
      margin-bottom: 8px;
    }

    .panel {
      padding: 20px;
      background: white;
      border-radius: 10px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
    }

    .status {
      display: inline-block;
      margin-bottom: 16px;
      padding: 6px 12px;
      border-radius: 20px;
      background: #ddd;
    }

    button {
      margin-right: 8px;
      padding: 8px 14px;
      cursor: pointer;
    }

    pre {
      min-height: 240px;
      margin-top: 20px;
      padding: 16px;
      overflow: auto;
      color: #eaeaea;
      background: #1e1e1e;
      border-radius: 8px;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>
  <div class="panel">
    <h1>WebSocket product updates</h1>
    <p>
      Kelgan xabarlar sahifada va browser console'da ko‘rsatiladi.
    </p>

    <div id="status" class="status">Disconnected</div>

    <div>
      <button id="connectButton">Connect</button>
      <button id="disconnectButton">Disconnect</button>
      <button id="clearButton">Clear logs</button>
    </div>

    <pre id="logs"></pre>
  </div>

  <script>
    let socket = null;

    const statusElement = document.getElementById("status");
    const logsElement = document.getElementById("logs");

    function setStatus(text) {
      statusElement.textContent = text;
    }

    function writeLog(title, data = null) {
      const time = new Date().toLocaleTimeString();

      const message = data === null
        ? `[${time}] ${title}`
        : `[${time}] ${title}\n${JSON.stringify(data, null, 2)}`;

      logsElement.textContent += `${message}\n\n`;
      logsElement.scrollTop = logsElement.scrollHeight;

      console.log(title, data ?? "");
    }

    function getWebSocketUrl() {
      const protocol = location.protocol === "https:"
        ? "wss:"
        : "ws:";

      return `${protocol}//${location.host}/ws/products`;
    }

    function connect() {
      if (
        socket &&
        (
          socket.readyState === WebSocket.OPEN ||
          socket.readyState === WebSocket.CONNECTING
        )
      ) {
        writeLog("WebSocket allaqachon ulangan");
        return;
      }

      const url = getWebSocketUrl();

      setStatus("Connecting...");
      writeLog(`WebSocket ulanish boshlandi: ${url}`);

      socket = new WebSocket(url);

      socket.onopen = () => {
        setStatus("Connected");
        writeLog("WebSocket connected");
      };

      socket.onmessage = (event) => {
        try {
          const payload = JSON.parse(event.data);

          writeLog("WebSocket message", payload);
        } catch (error) {
          writeLog("WebSocket raw message", event.data);
          console.error("JSON parse error:", error);
        }
      };

      socket.onerror = (error) => {
        setStatus("Error");
        console.error("WebSocket error:", error);
        writeLog("WebSocket error");
      };

      socket.onclose = (event) => {
        setStatus("Disconnected");

        writeLog(
          `WebSocket closed: code=${event.code}, reason=${event.reason || "-"}`
        );

        socket = null;
      };
    }

    function disconnect() {
      if (!socket) {
        writeLog("WebSocket ulanmagan");
        return;
      }

      socket.close(1000, "Client disconnected");
    }

    document
      .getElementById("connectButton")
      .addEventListener("click", connect);

    document
      .getElementById("disconnectButton")
      .addEventListener("click", disconnect);

    document
      .getElementById("clearButton")
      .addEventListener("click", () => {
        logsElement.textContent = "";
      });

    connect();
  </script>
</body>
</html>
